<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cabeçalho do perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
html, body { width: 1280px; height: 280px; overflow: hidden; }
body { display: flex; flex-direction: column; justify-content: center; }
h1 { font: 600 64px/1 var(--titulo); letter-spacing: -.035em; }
.cargo { margin-top: 18px; font-size: 22px; font-weight: 500; color: var(--texto); }
.local { margin-top: 6px; font-size: 18px; color: var(--apoio); }
/* Um fio fino fecha o cabeçalho, no lugar de qualquer enfeite. */
.fio { margin-top: 40px; height: 1px; background: var(--borda); }
</style>
</head>
<body>
<!--
  O cabeçalho do perfil: nome, cargo e cidade, sem frase de efeito. Não tem texto que mude
  com a língua, então serve ao README em português e ao em inglês. ?tema=escuro troca as cores.
-->
<h1>Leonardo Ferreira</h1>
<p class="cargo">Full Stack Senior Software Engineer</p>
<p class="local">Diamantina, MG · Brasil</p>
<div class="fio"></div>
<script src="tema.js"></script>
</body>
</html>
